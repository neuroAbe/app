name: campaign_manager
description: Social Media Campaign Manager - A professional Flutter app for managing marketing campaigns.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4

  # Navigation
  go_router: ^12.1.1

  # Local Storage
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2

  # UI Components
  fl_chart: ^0.65.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1

  # Icons & Theming
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Material Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
